services:
  db:
    image: postgres:16-alpine
    container_name: gacha-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gacha
      POSTGRES_PASSWORD: gacha
      POSTGRES_DB: gacha
    ports:
      - "5432:5432"
    volumes:
      - gacha-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gacha"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gacha-db-data:

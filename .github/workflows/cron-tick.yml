# Free external scheduler for the serverless deployment: calls the reminder
# tick endpoint every 10 minutes (it also refreshes the official banner feed
# about once an hour). The endpoint is idempotent per reset
# boundary, so best-effort timing and duplicate runs are safe.
#
# No repository secret (ADR 0012): the job proves who it is with GitHub's OIDC
# token, which the app checks (this repository, this file, on main).
# Optional repository variable: APP_URL (defaults to the production URL).
name: reminder-tick

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: reminder-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call cron tick
        env:
          APP_URL: ${{ vars.APP_URL || 'https://gacha-hub-two.vercel.app' }}
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$APP_URL" | jq -r .value)
          curl -fsS -X POST "$APP_URL/api/cron/tick" -H "Authorization: Bearer $token"

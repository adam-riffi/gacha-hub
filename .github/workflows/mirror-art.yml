# Mirrors game art into the R2 bucket the web app reads (ADR 0006). Run by hand
# after a catalog refresh; the R2 credentials are repository secrets set by Georges.
name: mirror-art

on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game key, or all"
        required: true
        default: all

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm --prefix scripts/assets ci
      - run: npm --prefix scripts/assets run mirror -- --game "${GAME}"
        env:
          GAME: ${{ inputs.game }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

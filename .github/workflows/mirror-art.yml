# Mirrors game art into the Vercel Blob store the web app reads (ADR 0013). Run
# by hand after a catalog refresh. No repository secret (ADR 0012): the job
# proves who it is with GitHub's OIDC token, takes the store's token from the
# app and reports back where the pictures landed. Optional repository variable:
# APP_URL.
name: mirror-art

on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game key, or all"
        required: true
        default: all

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm --prefix scripts/assets ci
      - name: Mirror with the art store's token from the app, then report where the pictures landed
        env:
          GAME: ${{ inputs.game }}
          APP_URL: ${{ vars.APP_URL || 'https://gacha-hub-two.vercel.app' }}
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$APP_URL" | jq -r .value)
          store=$(curl -fsS -X POST "$APP_URL/api/cron/art-store" -H "Authorization: Bearer $token")
          BLOB_READ_WRITE_TOKEN=$(jq -r .blobToken <<<"$store")
          echo "::add-mask::$BLOB_READ_WRITE_TOKEN"
          export BLOB_READ_WRITE_TOKEN
          npm --prefix scripts/assets run mirror -- --game "$GAME" | tee mirror.log
          base=$(grep -oE '^\[mirror\] base .*' mirror.log | tail -1 | cut -d' ' -f3-)
          if [ -n "$base" ]; then
            # A fresh proof: GitHub's token from the start of the job expires before a long mirror ends.
            token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$APP_URL" | jq -r .value)
            curl -fsS -X POST "$APP_URL/api/cron/art-base" -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "$(jq -cn --arg base "$base" '{base: $base}')"
          fi

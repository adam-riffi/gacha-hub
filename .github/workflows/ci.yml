name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint --if-present
      - run: npm run typecheck
      # `npm test` provisions a throwaway SQLite DB (regenerating the Prisma
      # client for sqlite) via the server's pretest hook, then runs vitest.
      - run: npm test
      # Restore the Postgres client for the production build.
      - run: npm run prisma:generate
      - run: npm run build
